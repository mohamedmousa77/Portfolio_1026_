name: Build and deploy Node.js app to Azure Web App - mohamedmousa-portfolio

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install and build
        run: |
          npm install
          npm run build

      # TRCCO CRUCIALE: Facciamo l'upload puntando direttamente alla cartella dist
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B790CB688417483380ECB8DFE26A3BD8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AC7426AF66C646D9A6751ED333E1D5D1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9A6A862DA7874317BA28C310B4B8C460 }}

      # Deploy diretto dei file compilati contenuti nella cartella dist
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mohamedmousa-portfolio'
          slot-name: 'Production'
          package: .
